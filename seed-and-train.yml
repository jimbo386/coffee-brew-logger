name: Seed DB and Train Model

on:
  push:
    branches:
      - postgres-backend-s1

jobs:
  seed-and-train:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: coffee
          POSTGRES_PASSWORD: coffee
          POSTGRES_DB: coffee_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U coffee -d coffee_db" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libpq-dev

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic data
        run: |
          python synthetic/generate_synthetic.py --n 500

      - name: Train ML model and produce suggestions
        env:
          # ML training does not need DB access for this demo
          PYTHONUNBUFFERED: 1
        run: |
          python ml/train.py --input data/brews.csv --output data/suggestions.json

      - name: Wait for Postgres
        env:
          DATABASE_URL: postgresql://coffee:coffee@localhost:5432/coffee_db
        run: |
          echo "Waiting for Postgres to be available..."
          for i in {1..30}; do
            python - <<PY
import time, sys
import psycopg2
try:
    conn = psycopg2.connect('dbname=coffee_db user=coffee password=coffee host=localhost port=5432')
    conn.close()
    print('Postgres is available')
    sys.exit(0)
except Exception as e:
    print('Postgres not ready yet:', e)
    time.sleep(2)
PY
          done

      - name: Seed Postgres DB
        env:
          DATABASE_URL: postgresql://coffee:coffee@localhost:5432/coffee_db
        run: |
          python -m backend.seed --input data/brews.csv

      - name: Upload suggestions artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suggestions
          path: data/suggestions.json
